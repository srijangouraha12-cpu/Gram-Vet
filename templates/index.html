<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
let mediaRecorder = null;
let audioChunks = [];
let speechRec = null;
let silenceTimer = null;
let finalTranscript = "";

function startSymptomVoiceRecording(btn) {
    if (mediaRecorder && mediaRecorder.state === "recording") {
        stopSymptomVoiceRecording();
        return;
    }
    
    let lang = document.getElementById("langApp").value || "en";
    let speechLang = "en-IN";
    if (lang === "hi") speechLang = "hi-IN";
    if (lang === "mr") speechLang = "mr-IN";

    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            let blob = new Blob(audioChunks, { type: "audio/webm" });
            let reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
                window._lastAudioBase64 = reader.result;
                document.getElementById("voiceStatus").innerText = "Audio recorded! Matching symptoms...";
                matchSymptomsFromTranscript(finalTranscript);
            }
        };

        let vStatus = document.getElementById("voiceStatus");
        let vText = document.getElementById("voiceTranscript");
        if (vStatus) { vStatus.style.display = "block"; vStatus.innerText = "Listening... Speak your symptoms."; }
        if (vText) { vText.style.display = "block"; vText.innerText = ""; }
        finalTranscript = "";
        
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-top:-2px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>'; // red stop or something
        btn.style.background = "var(--red)";

        let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            speechRec = new SpeechRecognition();
            speechRec.continuous = true;
            speechRec.interimResults = true;
            speechRec.lang = speechLang;

            speechRec.onresult = function(event) {
                clearTimeout(silenceTimer);
                
                let interim = "";
                finalTranscript = "";
                for (let i = 0; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interim += event.results[i][0].transcript;
                }
                if (vText) vText.innerText = finalTranscript + " " + interim;

                silenceTimer = setTimeout(() => { stopSymptomVoiceRecording(); }, 3000);
            };
            
            speechRec.onend = function() {};
            speechRec.start();
            silenceTimer = setTimeout(() => { stopSymptomVoiceRecording(); }, 3000);
        } else {
            if (vText) vText.innerText = "Speech recognition not supported in this browser. Audio will be saved.";
            silenceTimer = setTimeout(() => stopSymptomVoiceRecording(), 5000);
        }

        mediaRecorder.start();
    }).catch(err => {
        alert("Microphone access denied or error: " + err);
    });
}

function stopSymptomVoiceRecording() {
    clearTimeout(silenceTimer);
    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
    }
    if (speechRec) {
        try { speechRec.stop(); } catch(e){}
    }
    let btn = document.getElementById("micBtn");
    if (btn) {
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-top:-2px;"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
        btn.style.background = "";
    }
}


</script>

function validatePhone(phone) {
  let p = String(phone || "").trim().replace(/[\s\-\+]/g, "");
  if (p.startsWith("91") && p.length === 12) p = p.slice(2);
  else if (p.startsWith("0") && p.length === 11) p = p.slice(1);
  if (p.length === 10 && /^[6-9]\d{9}$/.test(p)) {
    return p;
  }
  return null;
}

async function searchVillageLocation(vName, pin, btn) {
  if (!vName) return false;
  let oldText = btn ? btn.innerHTML : "";
  if (btn) btn.innerHTML = t("gps_locating");
  try {
    let q = encodeURIComponent(vName + (pin ? ", " + pin : "") + ", Maharashtra, India");
    let r = await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1`);
    let data = await r.json();
    if (!data || !data.length) {
      let q2 = encodeURIComponent(vName + ", India");
      let r2 = await fetch(`https://nominatim.openstreetmap.org/search?q=${q2}&format=json&limit=1`);
      data = await r2.json();
    }
    if (data && data.length > 0) {
      window.userLat = parseFloat(data[0].lat);
      window.userLon = parseFloat(data[0].lon);
      if (btn) btn.innerHTML = t("gps_captured");
      return true;
    }
  } catch(e) {}
  if (btn) btn.innerHTML = oldText;
  return false;
}

async function fetchGPS(btn) {
    let oldText = btn.innerHTML;
    btn.innerHTML = t("gps_locating");
    
    if (!navigator.geolocation) {
        let v = (document.getElementById('svillage') ? document.getElementById('svillage').value : "").trim();
        let pin = (document.getElementById('spin') ? document.getElementById('spin').value : "").trim();
        if (v) {
            let found = await searchVillageLocation(v, pin, btn);
            if (found) return;
        }
        alert(t("gps_denied_village_search"));
        btn.innerHTML = oldText;
        return;
    }
    
    navigator.geolocation.getCurrentPosition(async (pos) => {
        window.userLat = pos.coords.latitude;
        window.userLon = pos.coords.longitude;
        
        try {
            let r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${window.userLat}&lon=${window.userLon}&format=json`);
            let data = await r.json();
            let addr = data.address || {};
            let village = addr.village || addr.town || addr.suburb || addr.city || addr.county || "";
            let pincode = addr.postcode || "";
            
            // Only fill village and pincode if fields are currently empty
            let vField = document.getElementById('svillage');
            let pField = document.getElementById('spin');
            if (vField && !vField.value.trim()) vField.value = village;
            if (pField && !pField.value.trim()) pField.value = pincode;
            
            btn.innerHTML = t("gps_captured");
        } catch (e) {
            btn.innerHTML = t("gps_captured");
        }
    }, async (err) => {
        // Fallback: If user doesn't give GPS permission, take village name and search for it!
        let v = (document.getElementById('svillage') ? document.getElementById('svillage').value : "").trim();
        let pin = (document.getElementById('spin') ? document.getElementById('spin').value : "").trim();
        if (v) {
            let found = await searchVillageLocation(v, pin, btn);
            if (found) return;
        }
        alert(t("gps_denied_village_search"));
        btn.innerHTML = oldText;
    }, { timeout: 8000 });
}

function symptomLabel(s) {
  if (currentLang === "hi" && SYMPTOM_LABELS[s]?.hi) return SYMPTOM_LABELS[s].hi;
  if (currentLang === "mr" && SYMPTOM_LABELS[s]?.mr) return SYMPTOM_LABELS[s].mr;
  return s;
}

function diseaseLabel(d) {
  if (!d) return "—";
  if (d.includes("Foot_and_Mouth_Disease") || d.includes("FMD")) return t("d_fmd", d);
  if (d.includes("Lumpy_Skin_Disease")) return t("d_lsd", d);
  if (d.includes("Hemorrhagic_Septicemia")) return t("d_hs", d);
  if (d.includes("Black_Quarter")) return t("d_bq", d);
  if (d.includes("Mastitis")) return t("d_mastitis", d);
  return d;
}

function statusLabel(s) {
  if (!s) return "—";
  return t("t_" + s.toLowerCase(), s);
}

function symptomGrid(selected=[]){
  return `<div class="symgrid">${SYMPTOMS.map(s=>`<label class="sym"><input class="symcheck" type="checkbox" value="${esc(s)}" ${selected.includes(s)?"checked":""}> ${esc(symptomLabel(s))}</label>`).join("")}</div>`;
}

async function loadReportWeather(aid){
  let box=document.getElementById("reportWeather");
  if(box) box.innerHTML=weatherCardHTML(null,aid,true);
  let afterCoords=async (lat,lon)=>{
    window.reportLat=lat; window.reportLon=lon;
    let q=(lat!=null&&lon!=null)?`lat=${lat}&lon=${lon}`:`animal_id=${aid}`;
    try{let j=await api("/api/weather?"+q); if(box) box.innerHTML=weatherCardHTML(j.weather,aid,false);}
    catch(e){ if(box) box.innerHTML=`<div class="notice amber" style="margin:12px 0">⚠️ ${esc(e.message)} ${aid?`<button type="button" class="btn ghost" style="padding:3px 8px" onclick="loadReportWeather(${aid})">🔄 ${t("m_refresh")}</button>`:""}</div>`; }
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>afterCoords(pos.coords.latitude,pos.coords.longitude),
      ()=>afterCoords(null,null),
      {timeout:8000,maximumAge:60000}
    );
  } else afterCoords(null,null);
}

async function submitReport(aid){
  let symptoms=[...document.querySelectorAll(".symcheck:checked")].map(x=>x.value);
  if(!symptoms.length)return alert(t("select_symptom"));
  let reportInputs={
    herd_size:Number(reportHerdSize.value||1),
    dist_waterbody_km:Number(reportWaterbody.value||1.2),
    vaccinated_fmd_date:reportVaccFmd.value,
    vaccinated_hs_date:reportVaccHs.value,
    vaccinated_lsd_date:reportVaccLsd.value,
    vaccinated_bq_date:reportVaccBq.value
  };
  if(window._reportBusy)return;
  window._reportBusy=true;
  let btn=[...modalBody.querySelectorAll("button")].find(b=>/Save report|सहेजें|जतन/i.test(b.textContent));
  if(btn){btn.disabled=true;btn.textContent=t("running_model");}

  // Ensure live GPS is captured if available
  if(navigator.geolocation && (window.reportLat == null || window.reportLon == null)) {
    try {
      let pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, {timeout: 4000, maximumAge: 60000}));
      window.reportLat = pos.coords.latitude;
      window.reportLon = pos.coords.longitude;
    } catch(err) {
      console.warn("Live GPS unavailable for report:", err);
    }
  }

  try{
    let j=await api("/api/cases/report",{method:"POST",body:JSON.stringify({animal_id:aid,symptoms,notes:reportNotes.value,latitude:window.reportLat,longitude:window.reportLon,audio_base64:window._lastAudioBase64,...reportInputs})});
    showPredictionResult(j);
  }catch(e){
    window._reportBusy=false;
    if(btn){btn.disabled=false;btn.textContent=t("save_report");}
    alert(e.message);
  }
}

async function refreshNotifications(){

    if(hasCriticalUnread) {

        }
    } else {
        window.sirenPlayed = false;
    }
  }catch{}

function playSiren() {
    try {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        let gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'square';
        let now = ctx.currentTime;
        let t = now;
        for(let i=0; i<3; i++) {
            osc.frequency.setValueAtTime(900, t);
            t += 0.5;
            osc.frequency.setValueAtTime(700, t);
            t += 0.5;
        }
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.1, now + 2.5);
        gain.gain.linearRampToValueAtTime(0, now + 3.0);
        osc.start(now);
        osc.stop(now + 3.0);
    } catch(e) {}
}

  main.innerHTML+=`<div class="grid three"><div class="card stat"><div><div class="eyebrow">Cases assessed</div><div class="big">${cs.length}</div></div><div class="stat-icon">📊</div></div><div class="card stat"><div><div class="eyebrow">Outbreak model</div><div class="big">${connected?"Connected":"Not connected"}</div></div><div class="stat-icon">🤖</div></div><div class="card stat"><div><div class="eyebrow">Alert radius</div><div class="big">5 km</div></div><div class="stat-icon">📍</div></div></div>
  <div class="card" style="margin-top:18px"><div class="toolbar"><h3>Cases needing field assessment</h3></div>${rows.slice(0,20).map(x=>{
    let role=gramvetState.currentUser.role;
    let op=x.r.outbreak_probability; if(op==null) op=x.r.escalation_probability;
    let disease=x.r.predictions?.[0]?.disease;
    let label=role==="government"
      ?(typeof op==="number"?Math.round(op*100)+"% outbreak risk":"Outbreak pending")
      :(typeof op==="number"?`${esc(disease||"Disease")} · ${Math.round(op*100)}% outbreak`:"Model result pending");
    return `<div class="animal-line"><div style="flex:1"><b>#${x.c.id} · ${esc(x.c.animal_name)}</b><div class="muted">${esc(x.c.village_name)} · ${esc(x.c.farmer_name)}</div></div><span class="pill ${op>=.7?"bad":op>=.4?"warn":"info"}">${label}</span><button class="btn secondary" onclick="showCase(${x.c.id})">Open</button></div>`;
  }).join("")||"<p class='muted'>No cases.</p>"}</div>`;
}
function debouncedVetSearch(){clearTimeout(window._d);window._d=setTimeout(async()=>{let j=await api("/api/vet/overview");let q=(dashSearch.value||"").toLowerCase();let arr=j.animals.filter(a=>[a.name,a.tag,a.farmer_name,a.village].join(" ").toLowerCase().includes(q));dashResults.innerHTML=arr.slice(0,12).map(a=>`<div class="animal-line"><div style="flex:1"><b>${esc(a.name)}</b><div class="muted">${esc(a.tag)} · ${esc(a.farmer_name)} · ${esc(a.village)}</div></div></div>`).join("")||"<div class='muted'>No matches.</div>"},200)}
async function govt(){

      <div class="bar" style="margin-top:10px;margin-bottom:20px"><span style="width:${Math.min(100,totals.vaccination_pct)}%"></span></div>
      <div style="display:flex;justify-content:space-between"><span>All-time resources dispatched</span><b>${totals.total_dispatched_all_time}</b></div>
      <div style="display:flex;justify-content:space-between;margin-top:5px"><span>This month dispatched</span><b>${totals.total_dispatched_monthly}</b></div>
    </div>
  </div>
  <div class="card" style="margin-top:18px;position:relative;z-index:1;">
    <div class="toolbar"><h3>Maharashtra Outbreak Map</h3></div>
    <div id="mahaMap" style="height:450px;border-radius:10px;"></div>
  </div>
  <div class="card" style="margin-top:18px"><h3>Veterinary performance</h3><div class="tablewrap"><table><thead><tr><th>Veterinarian</th><th>Phone</th><th>Cases</th><th>Closed</th><th>Vacc %</th><th>Animals</th><th>Farmers</th><th>Resources left / sent</th></tr></thead><tbody>${j.vets.map(v=>`<tr><td>${esc(v.name)}</td><td>${esc(v.phone)}</td><td>${v.handled}</td><td>${v.closed}</td><td>${v.vaccination_pct}%</td><td>${v.animals_under}</td><td>${v.farmers_under}</td><td>${v.resources_left} / ${v.resources_sent}</td></tr>`).join("")||"<tr><td colspan='8'>No vets registered.</td></tr>"}</tbody></table></div></div>
  <div class="grid two" style="margin-top:18px"><div class="card"><h3>Vaccinations by vaccine</h3>${j.vaccinations.by_type.map(v=>`<div class="animal-line"><div style="flex:1"><b>${esc(v.vaccine_name)}</b><div class="muted">${v.doses} event(s)</div></div><span class="pill">${v.quantity} doses</span></div>`).join('')||'<p class="muted">No vaccination events recorded.</p>'}</div><div class="card"><h3>Vaccinations by veterinarian</h3>${j.vaccinations.by_vet.map(v=>`<div class="animal-line"><div style="flex:1"><b>${esc(v.vet_name)}</b><div class="muted">${v.doses} event(s)</div></div><span class="pill">${v.quantity} doses</span></div>`).join('')||'<p class="muted">No vaccination events recorded.</p>'}</div></div>
  <div class="card" style="margin-top:18px"><h3>Vaccine stock usage</h3><div class="tablewrap"><table><thead><tr><th>Vaccine</th><th>Used</th><th>Remaining stock</th><th>Unit</th></tr></thead><tbody>${j.vaccinations.inventory_usage.map(v=>`<tr><td>${esc(v.resource_name)}</td><td>${v.used_quantity}</td><td>${v.remaining_quantity??'—'}</td><td>${esc(v.unit||'units')}</td></tr>`).join('')||'<tr><td colspan="4">No vaccine usage recorded.</td></tr>'}</tbody></table></div></div>

  setTimeout(() => {

      j.villages.forEach(v => {

        if (lat==null || lon==null) return;
        if (!v.active_cases || v.active_cases === 0) return;

          ? '<b style="color:red">🔴 HIGH RISK — Confirmed / Critical Outbreak (&gt;5 cases)</b>'
          : level==="MID"
          ? '<b style="color:orange">🟠 MID RISK — Cluster Detected (3–5 cases)</b>'
          : '<span style="color:green">🟢 Monitoring</span>';
        let marker = L.circleMarker([lat,lon],{color,fillColor:color,radius:9,fillOpacity:0.85}).addTo(map);

        marker.on('mouseover',function(){this.openPopup()});

        L.circle([lat,lon],{color,fillColor,fillOpacity:0.15,radius:5000}).addTo(map);

    }catch(mapErr){console.warn("Map error:",mapErr);}
  }, 100);
  try{
    let all=await api("/api/cases");
    if(window.govCaseTable) govCaseTable.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Case</th><th>Animal</th><th>Owner</th><th>Village</th><th>Vet</th><th>Status</th></tr></thead><tbody>${all.cases.slice(0,100).map(c=>`<tr><td>#${c.id}<div class="muted2">${esc(c.opened_at.replace("T"," ").slice(0,16))}</div></td><td>${esc(c.animal_name)} · ${esc(c.species)}</td><td>${esc(c.farmer_name)}</td><td>${esc(c.village_name)}</td><td>${esc(c.vet_name||"Unassigned")}</td><td>${esc(c.status)}</td></tr>`).join("")||"<tr><td colspan='6'>No cases.</td></tr>"}</tbody></table></div>`;
  }catch(e){if(window.govCaseTable)govCaseTable.innerHTML="<div class='muted'>Unable to load case records.</div>"}
}
function trendBars(arr){let max=Math.max(1,...arr.map(x=>x.cases));return arr.map(x=>`<div style="display:grid;grid-template-columns:84px 1fr 36px;gap:7px;align-items:center;margin:7px 0"><span class="mini">${esc(x.date.slice(5))}</span><div class="bar"><span style="width:${Math.round(x.cases/max*100)}%"></span></div><b style="font-size:11px">${x.cases}</b></div>`).join("")}
async function showInventory(){let j=await api("/api/govt/overview");modalBody.innerHTML=`<h2>Resource inventory</h2><p class="muted">Keep available quantities current so vets can request against real stock during the demo.</p><div>${j.inventory.map(x=>`<div class="animal-line"><div style="flex:1"><b>${esc(x.resource_name)}</b><div class="muted">${x.available_qty} ${esc(x.unit)}</div></div></div>`).join("")||"<div class='muted'>No inventory yet.</div>"}</div><div class="formgrid" style="margin-top:14px"><input id="resName" placeholder="e.g. FMD vaccine"><input id="resQty" type="number" min="0" placeholder="Available quantity"><input id="resUnit" placeholder="doses / kits / units" value="units"></div><button class="btn" onclick="saveInventory()">Save inventory</button>`;modal.classList.remove("hidden")}
async function saveInventory(){try{await api("/api/govt/inventory",{method:"POST",body:JSON.stringify({resource_name:resName.value,available_qty:Number(resQty.value),unit:resUnit.value})});showInventory()}catch(e){alert(e.message)}}
async function reviewResource(id,status){try{await api(`/api/govt/resource-request/${id}`,{method:"POST",body:JSON.stringify({status})});go("govt")}catch(e){alert(e.message)}}
async function boot(){

boot();
setInterval(refreshNotifications,20000);

let mediaRecorder = null;
let audioChunks = [];
let speechRec = null;
let silenceTimer = null;
let finalTranscript = "";

function startSymptomVoiceRecording(btn) {
    if (mediaRecorder && mediaRecorder.state === "recording") {
        stopSymptomVoiceRecording();
        return;
    }
    
    let lang = document.getElementById("langApp").value || "en";
    let speechLang = "en-IN";
    if (lang === "hi") speechLang = "hi-IN";
    if (lang === "mr") speechLang = "mr-IN";

    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            let blob = new Blob(audioChunks, { type: "audio/webm" });
            let reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
                window._lastAudioBase64 = reader.result;
                document.getElementById("voiceStatus").innerText = "Audio recorded! Matching symptoms...";
                matchSymptomsFromTranscript(finalTranscript);
            }
        };

        let vStatus = document.getElementById("voiceStatus");
        let vText = document.getElementById("voiceTranscript");
        if (vStatus) { vStatus.style.display = "block"; vStatus.innerText = "Listening... Speak your symptoms."; }
        if (vText) { vText.style.display = "block"; vText.innerText = ""; }
        finalTranscript = "";
        
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-top:-2px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>'; // red stop or something
        btn.style.background = "var(--red)";

        let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            speechRec = new SpeechRecognition();
            speechRec.continuous = true;
            speechRec.interimResults = true;
            speechRec.lang = speechLang;

            speechRec.onresult = function(event) {
                clearTimeout(silenceTimer);
                
                let interim = "";
                finalTranscript = "";
                for (let i = 0; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interim += event.results[i][0].transcript;
                }
                if (vText) vText.innerText = finalTranscript + " " + interim;

                silenceTimer = setTimeout(() => { stopSymptomVoiceRecording(); }, 3000);
            };
            
            speechRec.onend = function() {};
            speechRec.start();
            silenceTimer = setTimeout(() => { stopSymptomVoiceRecording(); }, 3000);
        } else {
            if (vText) vText.innerText = "Speech recognition not supported in this browser. Audio will be saved.";
            silenceTimer = setTimeout(() => stopSymptomVoiceRecording(), 5000);
        }

        mediaRecorder.start();
    }).catch(err => {
        alert("Microphone access denied or error: " + err);
    });
}

function stopSymptomVoiceRecording() {
    clearTimeout(silenceTimer);
    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
    }
    if (speechRec) {
        try { speechRec.stop(); } catch(e){}
    }
    let btn = document.getElementById("micBtn");
    if (btn) {
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-top:-2px;"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
        btn.style.background = "";
    }
}


async function matchSymptomsFromTranscript(text) {
    let vStatus = document.getElementById("voiceStatus");
    if (vStatus) vStatus.innerText = "Processing text with AI / Extractor...";
    
    try {
        let resp = await api("/api/extract_symptoms", {
            method: "POST",
            body: JSON.stringify({text: text})
        });
        
        let matched = resp.symptoms || [];
        
        let checkboxes = document.querySelectorAll(".symcheck");
        checkboxes.forEach(cb => {
            if (matched.includes(cb.value)) {
                cb.checked = true;
            }
        });

        if (vStatus) {
            vStatus.innerText = matched.length > 0 ? ("Extracted: " + matched.join(", ")) : "No exact symptoms matched from description. Audio saved.";
        }
    } catch(e) {
        console.error("Extraction error", e);
        if (vStatus) vStatus.innerText = "Error extracting symptoms. Audio saved.";
    }
}
